spring:
  datasource:
    url: jdbc:h2:mem:threadflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
threadflow:
  jwt:
    secret: test-only-jwt-signing-secret-with-at-least-32-characters
    expiration-minutes: 30
  cookie:
    secure: false
    same-site: Lax
