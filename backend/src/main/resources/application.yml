spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/threadflow}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

threadflow:
  jwt:
    secret: ${THREADFLOW_JWT_SECRET}
    expiration-minutes: ${THREADFLOW_JWT_EXPIRATION_MINUTES:480}
  cookie:
    secure: ${THREADFLOW_COOKIE_SECURE:true}
    same-site: ${THREADFLOW_COOKIE_SAME_SITE:Lax}
  demo:
    merchandiser-email: ${THREADFLOW_DEMO_MERCHANDISER_EMAIL:}
    merchandiser-password: ${THREADFLOW_DEMO_MERCHANDISER_PASSWORD:}
    supervisor-email: ${THREADFLOW_DEMO_SUPERVISOR_EMAIL:}
    supervisor-password: ${THREADFLOW_DEMO_SUPERVISOR_PASSWORD:}
  production:
    photo-storage-root: ${THREADFLOW_PRODUCTION_PHOTO_STORAGE_ROOT:${java.io.tmpdir}/threadflow-production-photos}