services:
  db:
    image: postgres:16-alpine
    container_name: threadflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: threadflow
      POSTGRES_USER: threadflow_app
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - threadflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadflow_app -d threadflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  threadflow_pgdata:
