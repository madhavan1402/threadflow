services:
  db:
    image: mysql:8.0
    container_name: threadflow-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: threadflow
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:-threadflow_app}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "3306:3306"
    volumes:
      - threadflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  threadflow_mysql_data:
